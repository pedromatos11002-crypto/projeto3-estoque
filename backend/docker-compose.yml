version: '3.8'
services:
  db-estoque:
    image: postgres:16
    container_name: db-estoque
    restart: unless-stopped
    environment:
      POSTGRES_DB: estoque
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: estoque123
    ports:
      - "5434:5432"
    volumes:
      - estoque_data:/var/lib/postgresql/data

volumes:
  estoque_data:
